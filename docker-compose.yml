services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis

  migrate:
    build: .
    env_file:
      - .env.docker
    depends_on:
      - postgres
    command: >
      goose -dir migrations postgres "$POSTGRES_URL" up

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER:  ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

volumes:
  postgres_data:
